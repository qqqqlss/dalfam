name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android · 공통 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Gradle 캐시와 wrapper 검증(gradle-wrapper.jar 변조 확인)을 맡는다.
      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트
        run: ./gradlew :domain:jvmTest :data:jvmTest :shared:testAndroidHostTest

      - name: Android 디버그 빌드
        run: ./gradlew :androidApp:assembleDebug

  ios:
    name: iOS 컴파일 · 테스트
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # Kotlin/Native 컴파일러와 의존성을 캐시한다.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: iOS 시뮬레이터 테스트
        run: ./gradlew :domain:iosSimulatorArm64Test :data:iosSimulatorArm64Test

      - name: Shared 프레임워크 빌드
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:compileKotlinIosArm64
